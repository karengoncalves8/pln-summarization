[project]
name = "pln-summarization"
version = "0.1.0"
description = "FastAPI service for text summarization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.4",
    "loguru>=0.7.3",
    "nltk>=3.10.4",
    "pydantic-settings>=2.16.2",
    "spacy>=3.8.18",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
]


[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pylint.main]
py-version = "3.12"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
